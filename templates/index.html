<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/index.css">
    <link rel="shortcut icon" href="../static/images/icons8-sent-16.png">
    <meta charset="UTF-8">
    <title>Anonymous Chat</title>
</head>
<body>

    <div id="name-screen" style="display: none;">
        <div id="name-box">
            <img src="../static/images/icons8-sent-64.png">
            <h2>یک نام انتخاب کنید</h2>
            <p>این نام دائمی است. بعد از انتخاب، دیگر قابل تغییر نیست.</p>
            <input id="nameInput" type="text" maxlength="30" placeholder="نام شما" autocomplete="off">
            <span id="nameError"></span>
            <button id="nameBtn">ورود به چت</button>
        </div>
    </div>

    <div id="all">
        <div id="chat-header">
            <img src="../static/images/icons8-sent-64.png">
            <div id="header-text">
                <h2>چت ناشناس</h2>
                <div id="header-sub">
                    <span id="onlineCount"></span>
                    <span id="myName">در حال دریافت نام ...</span>
                </div>
            </div>
        </div>
        <div id="messages"></div>
        <div id="input-row">
            <textarea id="msgInput" name="msg" placeholder="پیام خود را بنویسید ..."></textarea>
            <button onclick="sendMsg()"><img src="../static/images/icons8-sent-64.png" alt="Send"></button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io({ autoConnect: false })

        const MAX_LEN = 500

        let myName = null

        socket.on('connect', () => {
            const name = localStorage.getItem('chatName')
            const token = localStorage.getItem('chatToken')

            if (name && token) {
                socket.emit('claim_name', { name: name, token: token })
            }
        })

        socket.on('claim_error', (msg) => {
            document.getElementById('nameError').textContent = msg
            document.getElementById('name-screen').style.display = 'flex'
        })

        socket.on('name_ok', (data) => {
            if (data.token) {
                localStorage.setItem('chatName', data.name)
                localStorage.setItem('chatToken', data.token)
            }

            myName = data.name
            document.getElementById('myName').textContent = data.name
            document.getElementById('name-screen').style.display = 'none'
        })

        socket.on('history', (messages) => {
            const messagesBox = document.getElementById('messages')
            messagesBox.innerHTML = ''

            messages.forEach((msg) => {
                addMessage(msg.text, msg.time, msg.user_id)
            })
            messagesBox.scrollTop = messagesBox.scrollHeight
        })

        socket.on('online_count', (count) => {
            document.getElementById('onlineCount').textContent = `${count} نفر آنلاین`
        })

        socket.on('msg', (data) => {
            addMessage(data.text, data.time, data.user_id)
        })

        function addMessage(text, time, senderName) {
            const messagesBox = document.getElementById('messages')

            const p = document.createElement('p')
            p.classList.add('message')

            if (senderName === myName) {
                p.classList.add('my-message')
            } else {
                p.classList.add('other-message')
            }

            const nameSpan = document.createElement('span')
            nameSpan.classList.add('name')
            nameSpan.textContent = senderName

            const textSpan = document.createElement('span')
            textSpan.textContent = text

            const timeSpan = document.createElement('span')
            timeSpan.classList.add('time')
            timeSpan.textContent = time

            p.appendChild(nameSpan)
            p.appendChild(textSpan)
            p.appendChild(timeSpan)
            messagesBox.appendChild(p)
            messagesBox.scrollTop = messagesBox.scrollHeight
        }

        function sendMsg() {
            const input = document.getElementById('msgInput')
            const message = input.value.trim()

            if (message === "") return

            if (message.length > MAX_LEN) {
                alert(`حداکثر ${MAX_LEN} کاراکتر مجاز است.\nشما ${message.length} کاراکتر نوشته‌اید.`)
                return
            }

            socket.emit('msg', message)
            input.value = ''
            input.focus()
        }

        document.getElementById('nameBtn').addEventListener('click', claimName)

        document.getElementById('nameInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.isComposing) {
                e.preventDefault()
                claimName()
            }
        })

        function claimName() {
            const name = document.getElementById('nameInput').value.trim()
            document.getElementById('nameError').textContent = ''

            if (name === '') {
                document.getElementById('nameError').textContent = 'نام نمی‌تواند خالی باشد.'
                return
            }

            socket.emit('claim_name', { name: name, token: localStorage.getItem('chatToken') })
        }

        const savedName = localStorage.getItem('chatName')
        const savedToken = localStorage.getItem('chatToken')

        if (savedName && savedToken) {
            myName = savedName
            document.getElementById('myName').textContent = savedName
        } else {
            document.getElementById('name-screen').style.display = 'flex'
            document.getElementById('nameInput').focus()
        }

        socket.connect()

        document.getElementById('msgInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                e.preventDefault()
                sendMsg()
            }
        })
    </script>

</body>
</html>
